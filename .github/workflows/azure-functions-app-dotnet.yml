
name: Deploy DotNet project to Azure Function App

on:
  pull_request:

env:
  AZURE_FUNCTIONAPP_NAME: 'your-app-name'   # set this to your function app name on Azure
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'       # set this to the path to your function app project, defaults to the repository root
  DOTNET_VERSION: '6.0.x'                   # set this to the dotnet version to use (e.g. '2.1.x', '3.1.x', '5.0.x')

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # For Linux, use ubuntu-latest
    environment: dev
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: Run scan with threat-agent
      uses: threatrix/threat-agent-scan@master
      with:
          eid: ${{ secrets.THREATRIX_EID }}
          oid: ${{ secrets.THREATRIX_OID }}
          scpid: ${{ secrets.THREATRIX_SCP_ID }}
          server-url: 'https://app.threatrix.io'
          scm-token: ${{ secrets.TOKEN }}
          api-token: ${{ secrets.THREATRIX_SERVER_API_KEY }}
          app-name: ${{ github.repository }}
          tags: 'the tags'
          branch: ${{ github.head_ref != '' && github.head_ref || github.ref_name }}
          pr-num: ${{ github.event.pull_request.number != '' && github.event.pull_request.number || 'UNDEFINED' }}
    env:
      TRX_EID: ${{ secrets.THREATRIX_EID }}
      TRX_OID: ${{ secrets.THREATRIX_OID }}
      SCP_ID: ${{ secrets.THREATRIX_SCP_ID }}
